<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">

  <!-- Dashboard -->
  <section id="dashboard" class="container mt-5">
    <h2>Dashboard</h2>
    <p>Overview of tasks, schedules, and notes.</p>
  </section>

  <!-- Tasks -->
  <section id="tasks" class="container mt-5">
    <h2>Task Manager</h2>
    <form>
      <div class="mb-3">
        <label for="task" class="form-label">New Task</label>
        <input type="text" class="form-control" id="task" placeholder="Enter your task">
      </div>
      <button type="submit" class="btn btn-primary">Add Task</button>
    </form>
  </section>

  <!-- Calendar -->
  <section id="calendar" class="container mt-5">
    <h2>Calendar</h2>
    <p>Upcoming events and schedules.</p>
  </section>

  <!-- Notes -->
  <section id="notes" class="container mt-5">
    <h2>Notes</h2>
    <textarea class="form-control" rows="4" placeholder="Write your notes here..."></textarea>
  </section>

  <!-- Voice Command Button -->
  <div class="container mt-5 text-center">
    <button onclick="startVoiceCommand()" class="btn btn-success">🎤 Start Voice Command</button>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center p-3 mt-5">
    <p>&copy; 2026 My AI Assistant</p>
  </footer>
